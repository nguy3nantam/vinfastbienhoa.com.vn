server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache max=2000 inactive=20s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;
    gzip_types text/css application/javascript application/x-javascript application/json application/xml text/xml text/javascript image/svg+xml text/plain;

    # Internal worker endpoint must never be reachable from the public proxy.
    location = /hcgi/platform/api/internal/news-ingest {
        return 404;
    }

    location = /hcgi/platform/api/internal/slider-ingest {
        return 404;
    }

    location /hcgi/platform/ {
        proxy_pass http://pocketbase:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://pocketbase:8090/api/custom/sitemap.xml;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        absolute_redirect off;
        return 302 /favicon.svg;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:ico|svg|woff2?|eot|ttf|otf|png|jpe?g|webp|gif|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; upgrade-insecure-requests" always;

    location / {
        # Revalidate HTML so deployments do not leave references to old chunks.
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
