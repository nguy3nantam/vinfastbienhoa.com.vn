name: vinfastbienhoacomvn

services:
  web:
    container_name: vinfastbienhoacomvn-web
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ && wget -q --spider http://127.0.0.1/hcgi/platform/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.vinfastbienhoacomvn.rule=Host(`vinfastbienhoa.com.vn`) || Host(`www.vinfastbienhoa.com.vn`)
      - traefik.http.routers.vinfastbienhoacomvn.entrypoints=websecure
      - traefik.http.routers.vinfastbienhoacomvn.tls.certresolver=letsencrypt
      - traefik.http.services.vinfastbienhoacomvn.loadbalancer.server.port=80

  pocketbase:
    container_name: vinfastbienhoacomvn-pocketbase
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    volumes:
      - ./pb_data:/data
    environment:
      PB_ENCRYPTION_KEY: "${PB_ENCRYPTION_KEY}"
      PB_SUPERUSER_EMAIL: "${PB_SUPERUSER_EMAIL}"
      PB_SUPERUSER_PASSWORD: "${PB_SUPERUSER_PASSWORD}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  news-sync:
    container_name: vinfastbienhoacomvn-news-sync
    build:
      context: ./scripts/news-sync
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PB_URL: http://pocketbase:8090
      SYNC_INTERVAL_SECONDS: "21600"
    healthcheck:
      test: ["CMD-SHELL", "test ! -f /tmp/sync-failed && test -f /tmp/last-sync && find /tmp/last-sync -mmin -420 -print -quit | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m

  backup:
    container_name: vinfastbienhoacomvn-backup
    build:
      context: ./scripts/backup
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: unless-stopped
    environment:
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      # SQLite WAL readers may need to create shared-memory sidecar files.
      # The backup command still opens the databases with -readonly.
      - ./pb_data:/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "test ! -f /tmp/backup-failed && test -f /tmp/last-backup && find /tmp/last-backup -mmin -1500 -print -quit | grep -q ."]
      interval: 30m
      timeout: 5s
      retries: 3
      start_period: 2m
